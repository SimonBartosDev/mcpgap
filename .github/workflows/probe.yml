name: Linux sandbox probe

# Temporary. Measures what sandboxing primitives the Linux runners actually
# provide, so the Linux backend is designed against reality rather than
# documentation. Deleted once the backend lands.

on:
  push:
    branches: [linux-sandbox]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe (as shipped)
        run: python3 tools/probe_linux_sandbox.py
      - name: Probe (after installing bubblewrap)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          echo "--- re-probing with bwrap present ---"
          python3 tools/probe_linux_sandbox.py
